  <!-- Crown top highlight -->
  <path d="M25 15 C27 13.5 29.5 12.8 32 12.8 C34.5 12.8 37 13.5 39 15"
        stroke="#a8ccff" stroke-width="1.6" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Sparkle -->
  <path d="M45 20 L46.2 23.8 L50 25 L46.2 26.2 L45 30 L43.8 26.2 L40 25 L43.8 23.8 Z"
